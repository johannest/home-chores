# Tests run against a throwaway in-memory database.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
vaadin.launch-browser=false
# Every test request shares one client key, so leave the landing-page rate limiter off;
# its algorithm is covered directly in RateLimiterTest.
homechores.ratelimit.enabled=false
