# Server
server.port=8080
server.address=127.0.0.1
server.forward-headers-strategy=native

# Thread budget. The host caps processes at 100, and on Linux that limit counts *threads* —
# every Java thread is a task against RLIMIT_NPROC / cgroup pids.max. So the goal is a low,
# and above all *flat*, thread count. Measured on the production jar: 29 threads whether idle
# or serving 600 concurrent requests, of which 12 are the bare JVM floor.
#
# Request handling runs on virtual threads, so Tomcat has no exec pool to grow: it keeps one
# carrier per available processor — two, because the run command pins
# -XX:ActiveProcessorCount=2 (see README, "Running in production") — no matter how many
# requests are in flight. This is what makes the thread count independent of traffic.
# server.tomcat.threads.max / min-spare are deliberately absent — they configure the platform
# thread pool that no longer exists, so setting them would only mislead.
spring.threads.virtual.enabled=true

# One connection per carrier is plenty for a family-sized board, and each pool costs a
# housekeeper thread.
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1

# Only the booking-expiry sweep and the retention purge are scheduled, and neither is hot.
spring.task.scheduling.pool.size=1

# H2 file-based database — data survives restarts and is shared across all members/devices
spring.datasource.url=jdbc:h2:file:./data/homechores;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

# Privacy: keep client IP addresses out of the logs. Tomcat access logging (whose
# pattern would record IPs) stays off, and no request-level logging is enabled.
server.tomcat.accesslog.enabled=false

# Retention (see HomeCleanupService)
# Purges homes that were created and abandoned before anyone used them: no chore history
# at all AND at most one member. Homes a family actually used are never auto-deleted —
# there is no email or push channel here, so nobody could be warned first.
# 0 = disabled (default). A public instance might set 30; a family server wants 0.
homechores.retention.abandoned-home-days=0
homechores.retention.cron=0 30 3 * * *

# Stale join/rejoin requests (see ChoreService.expireStaleRejoins)
# Abandoned pending requests and approved-but-never-collected sign-in tokens are deleted
# once they are 48h old; this is how often to look for them.
homechores.rejoin.sweep-ms=3600000

# Booking expiry (see ChoreService.releaseExpiredBookings)
# How often to sweep for lapsed "I'll do it" holds and free them. Holds are configured in
# whole hours per home, so a minute of lag is invisible — and the read path ignores a lapsed
# booking immediately regardless. The sweep is what makes the release show up on boards that
# are already open, since those only redraw when something in the home actually changes.
homechores.booking.sweep-ms=60000

# Sessions — short on purpose; see SessionContext for the per-role lifetimes.
# This value covers visitors who aren't signed in yet; SessionContext raises or lowers it
# per session once we know whether the member is an admin (3 min member / 15 min admin).
server.servlet.session.timeout=3m
# Without this, Vaadin's heartbeats keep an open tab's session alive forever and the
# timeouts above would only apply to closed tabs. With it, the clock runs from the last
# real interaction: heartbeat and push traffic don't count as the user being there.
vaadin.closeIdleSessions=true
# Expiry is only noticed when some request runs the cleanup, so heartbeat more often than
# the shortest timeout — otherwise a 3-minute session lingers until the 5-minute default
# heartbeat happens to fire.
vaadin.heartbeatInterval=60

# Vaadin
vaadin.launch-browser=false
logging.level.org.atmosphere=warn
# Vaadin 25.2 defaults to ignoring npm packages published < 1 day ago (supply-chain
# cooldown). The current Vaadin frontend packages fall in that window, which breaks the
# dev-bundle install, so disable the age check (0 = install regardless of age).
vaadin.npm.minimumFrontendPackageAgeDays=0
